name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
  IMAGE_NAME: zavastore/web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse Azure credentials
        id: azure-creds
        run: |
          echo "::add-mask::$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')"
          echo "client-id=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> $GITHUB_OUTPUT
          echo "tenant-id=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> $GITHUB_OUTPUT
          echo "subscription-id=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')" >> $GITHUB_OUTPUT
          echo "client-secret=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ steps.azure-creds.outputs.client-id }}
          tenant-id: ${{ steps.azure-creds.outputs.tenant-id }}
          subscription-id: ${{ steps.azure-creds.outputs.subscription-id }}
          client-secret: ${{ steps.azure-creds.outputs.client-secret }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Build and push container image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
